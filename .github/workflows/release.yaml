name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: [self-hosted, docker-ci]
    steps:
      - uses: actions/checkout@v7
      # init: none — the runner is an ephemeral container without systemd.
      # The first substituter is a local caching proxy for cache.nixos.org;
      # nix falls back to the real cache if it is unreachable.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          init: none
          extra-conf: |
            substituters = http://172.30.0.251:8080 https://cache.nixos.org

      - name: Build
        run: |
          nix develop -c meson setup build \
            -Dgtk3=enabled -Dgtk4=enabled -Dqt5=disabled -Dqt6=disabled
          nix develop -c ninja -C build

      - name: Strip
        run: |
          for f in kime kime-check kime-indicator kime-candidate-window kime-xim kime-wayland; do
            [ -f "target/release/$f" ] && strip -s "target/release/$f"
          done
          [ -f "target/release/libkime_engine.so" ] && strip -s target/release/libkime_engine.so
          for f in build/src/frontends/*/lib*.so; do
            [ -e "$f" ] && strip -s "$f"
          done

      - name: Upload engine artifacts
        uses: actions/upload-artifact@v7
        with:
          name: engine
          path: |
            target/release/libkime_engine.so
            src/engine/capi/kime_engine.h
            src/engine/capi/kime_engine.hpp

      - name: Create archive
        run: |
          # run inside nix develop so the cargo rebuild (build_always_stale)
          # uses nix's rust, not the runner's rustup (which races on rust-src)
          DESTDIR=$(pwd)/kime-install nix develop -c ninja -C build install
          tar -C kime-install -caf kime-${{ github.ref_name }}.tar.zst .

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: kime-${{ github.ref_name }}.tar.zst

  build-qt5:
    needs: build-archive
    runs-on: [self-hosted, docker-ci]
    strategy:
      matrix:
        qt5: ['5.12.8', '5.15.2']
    steps:
      - uses: actions/checkout@v7

      # install-qt-action needs pip; the runner container's system python
      # is externally managed (PEP 668), so bring an isolated one
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download engine
        uses: actions/download-artifact@v8
        with:
          name: engine
          path: ./engine-artifacts

      - name: Install engine
        run: |
          sudo install -Dm755 engine-artifacts/target/release/libkime_engine.so -t /usr/lib
          sudo install -Dm644 engine-artifacts/src/engine/capi/kime_engine.h -t /usr/include
          sudo install -Dm644 engine-artifacts/src/engine/capi/kime_engine.hpp -t /usr/include
          sudo ldconfig

      - name: Install Qt ${{ matrix.qt5 }}
        uses: jurplel/install-qt-action@v4
        with:
          dir: /opt
          version: ${{ matrix.qt5 }}

      - name: Install meson
        run: sudo apt-get update && sudo apt-get install -y meson

      - name: Build Qt5 plugin
        run: |
          meson setup build -Dsystem_engine=true -Dqt5=enabled -Dqt6=disabled -Dgtk3=disabled -Dgtk4=disabled
          ninja -C build
          strip -s build/src/frontends/qt5/libkimeplatforminputcontextplugin.so
          cp build/src/frontends/qt5/libkimeplatforminputcontextplugin.so libkime-qt-${{ matrix.qt5 }}.so

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: libkime-qt-${{ matrix.qt5 }}.so

  build-qt6:
    needs: build-archive
    runs-on: [self-hosted, docker-ci]
    strategy:
      matrix:
        qt6: ['6.2.4', '6.5.3', '6.7.3', '6.8.2', '6.9.3', '6.10.3']
    steps:
      - uses: actions/checkout@v7

      # install-qt-action needs pip; the runner container's system python
      # is externally managed (PEP 668), so bring an isolated one
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download engine
        uses: actions/download-artifact@v8
        with:
          name: engine
          path: ./engine-artifacts

      - name: Install engine
        run: |
          sudo install -Dm755 engine-artifacts/target/release/libkime_engine.so -t /usr/lib
          sudo install -Dm644 engine-artifacts/src/engine/capi/kime_engine.h -t /usr/include
          sudo install -Dm644 engine-artifacts/src/engine/capi/kime_engine.hpp -t /usr/include
          sudo ldconfig

      - name: Install Qt ${{ matrix.qt6 }}
        uses: jurplel/install-qt-action@v4
        with:
          dir: /opt
          version: ${{ matrix.qt6 }}

      - name: Install meson
        run: sudo apt-get update && sudo apt-get install -y meson

      - name: Build Qt6 plugin
        run: |
          meson setup build -Dsystem_engine=true -Dqt6=enabled -Dqt5=disabled -Dgtk3=disabled -Dgtk4=disabled
          ninja -C build
          strip -s build/src/frontends/qt6/libkimeplatforminputcontextplugin.so
          cp build/src/frontends/qt6/libkimeplatforminputcontextplugin.so libkime-qt-${{ matrix.qt6 }}.so

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: libkime-qt-${{ matrix.qt6 }}.so

  build-deb:
    # needs a docker daemon for `container:` jobs, so this runs on the host
    # runner, not the sandboxed docker-ci one (tag pushes only — trusted code)
    runs-on: [self-hosted, arch]
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - container: ubuntu:22.04
            gtk3: enabled
            gtk4: enabled
            qt5: enabled
            qt6: enabled
            suffix: ubuntu-22.04
          - container: ubuntu:24.04
            gtk3: enabled
            gtk4: enabled
            qt5: enabled
            qt6: enabled
            suffix: ubuntu-24.04
          - container: debian:bookworm
            gtk3: enabled
            gtk4: enabled
            qt5: enabled
            qt6: enabled
            suffix: debian-bookworm
          - container: debian:trixie
            gtk3: enabled
            gtk4: enabled
            qt5: enabled
            qt6: enabled
            suffix: debian-trixie

    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # NOTE: meson is installed via pip below, not apt: ubuntu 22.04 ships
          # meson 0.61 and debian bookworm 1.0.1, both older than the >=1.1 the
          # project requires. ninja still comes from apt.
          PKGS="build-essential curl git pkg-config libclang-dev ninja-build python3 python3-venv"
          if [ "${{ matrix.gtk3 }}" = "enabled" ]; then PKGS="$PKGS libgtk-3-dev"; fi
          if [ "${{ matrix.gtk4 }}" = "enabled" ]; then PKGS="$PKGS libgtk-4-dev"; fi
          if [ "${{ matrix.qt5 }}" = "enabled" ]; then PKGS="$PKGS qtbase5-dev qtbase5-private-dev"; fi
          if [ "${{ matrix.qt6 }}" = "enabled" ]; then PKGS="$PKGS qt6-base-dev qt6-base-private-dev"; fi
          apt-get install -y $PKGS
          # modern meson in an isolated venv (avoids PEP668 on bookworm/trixie/24.04)
          python3 -m venv /opt/mesonenv
          /opt/mesonenv/bin/pip install --quiet --upgrade pip meson
          echo "/opt/mesonenv/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable

      - uses: actions/checkout@v7

      - name: Build
        run: |
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          meson setup build --prefix=/usr --libdir="lib/$MULTIARCH" \
            -Dgtk3=${{ matrix.gtk3 }} -Dgtk4=${{ matrix.gtk4 }} \
            -Dqt5=${{ matrix.qt5 }} -Dqt6=${{ matrix.qt6 }}
          ninja -C build

      - name: Strip
        run: |
          for f in kime kime-check kime-indicator kime-candidate-window kime-xim kime-wayland; do
            [ -f "target/release/$f" ] && strip -s "target/release/$f"
          done
          [ -f "target/release/libkime_engine.so" ] && strip -s target/release/libkime_engine.so
          for f in build/src/frontends/*/lib*.so; do
            [ -e "$f" ] && strip -s "$f"
          done

      - name: Build .deb
        run: |
          mkdir -p output
          bash packaging/build-deb.sh build output
          ARCH=$(dpkg --print-architecture)
          mv output/kime_*_${ARCH}.deb "output/kime-${{ github.ref_name }}_${ARCH}_${{ matrix.suffix }}.deb"

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: output/kime-*.deb

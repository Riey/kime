[package]
name = "kime-xim"
description = "Kime XIM server"
version = "0.3.0"
authors = ["Riey <creeper844@gmail.com>"]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
kime-engine-core = { path = "../../engine/core" }
kime-version = { path = "../../tools/version" }

xim = { version = "0.5", default-features = false, features = ["x11rb-server"] }
# xim = { path = "../../../../xim-rs", default-features = false, features = ["x11rb-server", "x11rb-xcb"] }

ahash = "0.8"
log = "0.4"
x11rb = { version = "0.13", features = [
    "render",
    "image",
], default-features = false }
pico-args = "0.5.0"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.26", default-features = false, features = ["text"] }
ab_glyph = "0.2"
